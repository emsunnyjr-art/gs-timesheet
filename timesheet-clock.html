<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GS Timesheet — Clock In/Out</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22GS%20Timesheet%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22theme_color%22:%22%23111827%22}">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#22c55e; --accent-out:#ef4444; --text:#f1f5f9; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:16px; }
  .card { background:var(--card); border-radius:16px; padding:20px; max-width:480px; margin:0 auto 16px; }
  h1 { font-size:18px; margin:0 0 16px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  select, input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:var(--text); font-size:16px; margin-bottom:14px; }
  .status { font-size:13px; color:var(--muted); margin-bottom:14px; min-height:18px; }
  .status.online { color:var(--accent); }
  .status.offline { color:#f59e0b; }
  .btn-row { display:flex; gap:10px; }
  button { flex:1; padding:16px; border-radius:12px; border:none; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-in { background:var(--accent); color:#052e16; }
  .btn-out { background:var(--accent-out); color:#450a0a; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  .camera-wrap { margin-top:14px; }
  video, canvas, img.preview { width:100%; border-radius:10px; display:none; }
  .camera-btn { background:#334155; color:var(--text); margin-top:8px; }
  .log { margin-top:16px; font-size:13px; color:var(--muted); }
  .log div { padding:6px 0; border-bottom:1px solid #334155; }
  .queued { color:#f59e0b; }
  .synced { color:var(--accent); }
</style>
</head>
<body>

<div class="card">
  <h1>Clock In / Out</h1>
  <div id="netStatus" class="status offline">Checking connection…</div>

  <label for="branchSelect">Branch</label>
  <select id="branchSelect"></select>

  <div style="display:flex; gap:8px; margin:14px 0;">
    <button type="button" id="scanModeBtn" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--accent); color:#052e16; font-weight:600;">Scan ID</button>
    <button type="button" id="manualModeBtn" style="flex:1; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text);">Manual Select</button>
  </div>

  <div id="scanPanel">
    <video id="qrVideo" autoplay playsinline muted style="width:100%; border-radius:10px; display:block;"></video>
    <canvas id="qrCanvas" style="display:none;"></canvas>
    <div id="scanStatus" style="text-align:center; margin-top:8px; color:var(--muted); font-size:13px;">Point camera at employee ID QR code</div>
  </div>

  <div id="manualPanel" style="display:none;">
    <label for="employeeSelect">Employee</label>
    <select id="employeeSelect"></select>
    <div id="manualPhotoPreview" style="display:none; margin-top:8px;">
      <img id="manualEmpPhoto" style="width:80px; height:80px; border-radius:8px; object-fit:cover;">
    </div>
    <label style="display:flex; align-items:center; gap:6px; margin-top:6px; font-size:13px; color:var(--muted);">
      <input type="checkbox" id="showAllEmployees" style="width:auto;"> Show all employees (cross-branch shift today)
    </label>
    <button type="button" id="manualUsePhotoBtn" style="margin-top:10px; width:100%; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text);">Take Attendance Photo & Continue</button>
  </div>

  <div id="confirmPanel" style="display:none; margin-top:14px; padding:12px; border:1px solid #334155; border-radius:10px;">
    <div style="font-weight:600; margin-bottom:6px;">Confirm identity</div>
    <div id="confirmName" style="color:var(--accent); font-size:15px; margin-bottom:8px;"></div>
    <div id="rosterWarning" style="display:none; color:#f59e0b; font-size:12px; margin-bottom:8px; padding:6px 8px; background:#f59e0b1a; border-radius:6px;"></div>
    <div id="actionBadge" style="font-size:13px; font-weight:600; margin-bottom:8px; padding:6px 8px; border-radius:6px;"></div>
    <img id="confirmPhoto" style="width:100%; border-radius:8px; display:block;">
    <div style="font-size:11px; color:var(--muted); margin-top:6px;">Attendance photo for this time in/out only — it does not change your profile photo. Profile photos can only be replaced by an admin.</div>
    <div id="overrideRow" style="display:none; margin-top:8px; font-size:12px; text-align:center;">
      <a href="#" id="overrideLink" style="color:var(--muted);">Not right? Switch to Time Out instead</a>
    </div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button type="button" id="retakeBtn" style="flex:1; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text);">Retake Photo</button>
      <button type="button" id="cancelBtn" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--accent-out); background:transparent; color:var(--accent-out);">Cancel</button>
      <button type="button" id="confirmBtn" style="flex:2; padding:10px; border-radius:8px; border:none; background:var(--accent); color:#052e16; font-weight:600;" disabled>Checking…</button>
    </div>
  </div>

  <div class="log" id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// ============================================================
// CONFIG — replace with your real Supabase project values
// ============================================================
const SUPABASE_URL = "https://cztkovsjxuaiburaudgk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eBOzdnFAdfFavl2QAYY6bA_lfAIJUhh";

// ------------------------------------------------------------
// INVARIANT: this page NEVER writes to employees.photo_url.
// The photo captured during clock in/out is attendance evidence
// only and is stored on timesheet_entries.photo_url (per entry).
// The employee's reference/ID photo (employees.photo_url, shown
// below and used on printed ID cards) can only be replaced from
// timesheet-admin.html, which requires the admin PIN. Do not add
// any code here that updates employees.photo_url.
// ------------------------------------------------------------

let supabase;
try {
  if (!window.supabase) {
    throw new Error("Supabase library failed to load from CDN — check internet connection or ad-blocker.");
  }
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (initErr) {
  document.getElementById("netStatus").textContent = "Setup error: " + initErr.message;
  document.getElementById("netStatus").className = "status offline";
  console.error(initErr);
}

const QUEUE_KEY = "gs_timesheet_offline_queue";

// ---------- Network status ----------
function updateNetStatus() {
  const el = document.getElementById("netStatus");
  if (navigator.onLine) {
    el.textContent = "Online — syncing";
    el.className = "status online";
    syncQueue();
  } else {
    el.textContent = "Offline — entries will queue on this phone";
    el.className = "status offline";
  }
}
window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);

// ---------- Load employees & branches ----------
let allEmployees = [];
let activeAssignments = []; // today's roster_assignments rows: [{employee_id, branch_id, shift_id, post_id, status, double_pump, emergency_roster}]

async function loadDropdowns() {
  const empSelect = document.getElementById("employeeSelect");
  const branchSelect = document.getElementById("branchSelect");
  const today = new Date().toISOString().slice(0, 10);
  try {
    const { data: employees, error: empErr } = await supabase
      .from("employees").select("id, full_name, tm_number, home_branch_id, photo_url").eq("status", "active").order("full_name");
    if (empErr) throw empErr;
    allEmployees = employees;

    const { data: branches, error: brErr } = await supabase
      .from("branches").select("id, code, name").order("code");
    if (brErr) throw brErr;
    branchSelect.innerHTML = branches.map(b => `<option value="${b.id}">${b.code} — ${b.name}</option>`).join("");

    // Crew list now comes from Roster (roster_assignments), scoped to today.
    // 'cancelled' assignments don't count as being on the roster; every other
    // status (scheduled/confirmed/reliever/swapped/no_show) still does, since
    // all of those mean someone was expected to show up today.
    const { data: assignments, error: raErr } = await supabase
      .from("roster_assignments")
      .select("employee_id, branch_id, shift_id, post_id, status, double_pump, emergency_roster")
      .eq("assignment_date", today)
      .neq("status", "cancelled");
    if (raErr) throw raErr;
    activeAssignments = assignments || [];

    localStorage.setItem("gs_dropdown_cache", JSON.stringify({ employees, branches: branchSelect.innerHTML, assignments: activeAssignments }));
    renderEmployeeOptions();
    branchSelect.addEventListener("change", renderEmployeeOptions);
    document.getElementById("showAllEmployees").addEventListener("change", renderEmployeeOptions);
  } catch (err) {
    const cached = localStorage.getItem("gs_dropdown_cache");
    if (cached) {
      const c = JSON.parse(cached);
      allEmployees = c.employees;
      branchSelect.innerHTML = c.branches;
      activeAssignments = c.assignments || [];
      renderEmployeeOptions();
      branchSelect.addEventListener("change", renderEmployeeOptions);
      document.getElementById("showAllEmployees").addEventListener("change", renderEmployeeOptions);
    } else {
      logMsg("Could not load employee/branch list: " + (err.message || err), "queued");
      console.error(err);
    }
  }
}

function renderEmployeeOptions() {
  const empSelect = document.getElementById("employeeSelect");
  const branchId = document.getElementById("branchSelect").value;
  const showAll = document.getElementById("showAllEmployees").checked;
  const assignedIds = new Set(activeAssignments.filter(a => a.branch_id === branchId).map(a => a.employee_id));
  const list = showAll ? allEmployees : allEmployees.filter(e => e.home_branch_id === branchId || assignedIds.has(e.id));
  const source = list.length ? list : allEmployees; // fall back to full list if branch has nobody assigned
  empSelect.innerHTML = source.map(e => {
    const tag = assignedIds.has(e.id) && e.home_branch_id !== branchId ? " · assigned" : "";
    return `<option value="${e.id}">${e.full_name} (${e.tm_number})${tag}</option>`;
  }).join("");
  updateManualPhotoPreview();
  empSelect.onchange = updateManualPhotoPreview;
}

function updateManualPhotoPreview() {
  const empSelect = document.getElementById("employeeSelect");
  const emp = allEmployees.find(e => e.id === empSelect.value);
  const wrap = document.getElementById("manualPhotoPreview");
  const img = document.getElementById("manualEmpPhoto");
  if (emp && emp.photo_url) {
    img.src = emp.photo_url;
    wrap.style.display = "block";
  } else {
    wrap.style.display = "none";
  }
}

// ---------- Mode toggle ----------
let mode = "scan"; // "scan" | "manual"
let qrLoopActive = false;
let sharedStream = null;
let selectedEmployeeId = null;
let selectedEmployeeName = null;
let capturedPhotoBlob = null;
let detectedAction = null; // "in" | "out" -- auto-determined, not chosen by the user

const scanModeBtn = document.getElementById("scanModeBtn");
const manualModeBtn = document.getElementById("manualModeBtn");
const scanPanel = document.getElementById("scanPanel");
const manualPanel = document.getElementById("manualPanel");
const confirmPanel = document.getElementById("confirmPanel");
const qrVideo = document.getElementById("qrVideo");
const qrCanvas = document.getElementById("qrCanvas");
const scanStatus = document.getElementById("scanStatus");

scanModeBtn.addEventListener("click", () => setMode("scan"));
manualModeBtn.addEventListener("click", () => setMode("manual"));

function setMode(m) {
  mode = m;
  scanModeBtn.style.background = m === "scan" ? "var(--accent)" : "#0f172a";
  scanModeBtn.style.color = m === "scan" ? "#052e16" : "var(--text)";
  scanModeBtn.style.border = m === "scan" ? "none" : "1px solid #334155";
  manualModeBtn.style.background = m === "manual" ? "var(--accent)" : "#0f172a";
  manualModeBtn.style.color = m === "manual" ? "#052e16" : "var(--text)";
  manualModeBtn.style.border = m === "manual" ? "none" : "1px solid #334155";
  scanPanel.style.display = m === "scan" ? "block" : "none";
  manualPanel.style.display = m === "manual" ? "block" : "none";
  confirmPanel.style.display = "none";
  resetSelection();
  if (m === "scan") startQrScan(); else stopCamera();
}

function resetSelection() {
  selectedEmployeeId = null;
  selectedEmployeeName = null;
  capturedPhotoBlob = null;
  detectedAction = null;
  document.getElementById("confirmBtn").disabled = true;
  document.getElementById("confirmBtn").textContent = "Checking…";
  document.getElementById("overrideRow").style.display = "none";
}

// ---------- Camera (shared by scan + manual capture) ----------
async function openCamera() {
  if (sharedStream) return;
  sharedStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  qrVideo.srcObject = sharedStream;
  qrVideo.style.display = "block";
}

function stopCamera() {
  qrLoopActive = false;
  if (sharedStream) {
    sharedStream.getTracks().forEach(t => t.stop());
    sharedStream = null;
  }
}

function captureFrame() {
  qrCanvas.width = qrVideo.videoWidth;
  qrCanvas.height = qrVideo.videoHeight;
  qrCanvas.getContext("2d").drawImage(qrVideo, 0, 0);
  return new Promise(resolve => qrCanvas.toBlob(blob => resolve(blob), "image/jpeg", 0.85));
}

// ---------- QR scan loop ----------
async function startQrScan() {
  scanStatus.textContent = "Starting camera…";
  try {
    await openCamera();
  } catch (err) {
    scanStatus.textContent = "Camera error: " + err.message;
    return;
  }
  scanStatus.textContent = "Point camera at employee ID QR code";
  qrLoopActive = true;
  requestAnimationFrame(qrTick);
}

function qrTick() {
  if (!qrLoopActive) return;
  if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
    qrCanvas.width = qrVideo.videoWidth;
    qrCanvas.height = qrVideo.videoHeight;
    const ctx = qrCanvas.getContext("2d");
    ctx.drawImage(qrVideo, 0, 0, qrCanvas.width, qrCanvas.height);
    const imageData = ctx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code && code.data) {
      const raw = code.data.trim();
      const emp = matchEmployeeFromQr(raw);
      if (emp) {
        onEmployeeIdentified(emp.id, emp.full_name);
        return; // stop the loop, don't schedule another frame
      } else {
        scanStatus.textContent = `QR read (${raw}) but no active employee matches it`;
      }
    }
  }
  requestAnimationFrame(qrTick);
}

// Accepts this app's own "EMP:<tm_number>" cards, a bare TM number, a raw
// employee id (uuid), or any QR text that simply contains the TM number
// somewhere in it (covers QR codes generated by other apps/systems).
function matchEmployeeFromQr(raw) {
  const candidate = raw.startsWith("EMP:") ? raw.slice(4).trim() : raw;
  let emp = allEmployees.find(e => e.tm_number === candidate) || allEmployees.find(e => e.id === candidate);
  if (emp) return emp;
  // Fallback: does the scanned text contain any known TM number as a whole token?
  const tokens = raw.split(/[^a-zA-Z0-9]+/).filter(Boolean);
  emp = allEmployees.find(e => tokens.includes(e.tm_number));
  return emp || null;
}

function checkRosterMatch(employeeId) {
  const branchId = document.getElementById("branchSelect").value;
  const emp = allEmployees.find(e => e.id === employeeId);
  if (!emp) return true; // unknown, nothing to warn about here
  const assigned = activeAssignments.some(a => a.branch_id === branchId && a.employee_id === employeeId);
  return emp.home_branch_id === branchId || assigned;
}

// Auto-detects whether this should be a Time In or Time Out: if the
// employee has an open entry (time_in set, time_out still null) from any
// prior punch, this is a Time Out; otherwise it's a Time In. This is what
// makes the roster's predetermined shift time matter in practice -- the
// person doesn't choose in/out themselves, the system infers it from
// whether they're already clocked in.
async function detectClockAction(employeeId) {
  try {
    const { data, error } = await supabase
      .from("timesheet_entries")
      .select("id")
      .eq("employee_id", employeeId)
      .is("time_out", null)
      .order("time_in", { ascending: false })
      .limit(1);
    if (error) throw error;
    return (data && data.length) ? "out" : "in";
  } catch (err) {
    console.error("detectClockAction failed, defaulting to Time In:", err);
    return "in"; // safest default if the lookup fails
  }
}

function renderActionBadge() {
  const badge = document.getElementById("actionBadge");
  const btn = document.getElementById("confirmBtn");
  const overrideRow = document.getElementById("overrideRow");
  const overrideLink = document.getElementById("overrideLink");
  if (detectedAction === "in") {
    badge.textContent = "Will record: TIME IN";
    badge.style.background = "#052e1680"; badge.style.color = "var(--accent)";
    btn.textContent = "Confirm — Time In"; btn.style.background = "var(--accent)"; btn.style.color = "#052e16";
    overrideLink.textContent = "Not right? Switch to Time Out instead";
  } else {
    badge.textContent = "Will record: TIME OUT";
    badge.style.background = "#450a0a80"; badge.style.color = "var(--accent-out)";
    btn.textContent = "Confirm — Time Out"; btn.style.background = "var(--accent-out)"; btn.style.color = "#450a0a";
    overrideLink.textContent = "Not right? Switch to Time In instead";
  }
  overrideRow.style.display = "block";
  btn.disabled = false;
}

document.getElementById("overrideLink").addEventListener("click", (e) => {
  e.preventDefault();
  detectedAction = detectedAction === "in" ? "out" : "in";
  renderActionBadge();
});

async function onEmployeeIdentified(id, name) {
  qrLoopActive = false;
  selectedEmployeeId = id;
  selectedEmployeeName = name;
  const blob = await captureFrame();
  showConfirm(blob);
}

// ---------- Manual mode: pick employee, then capture photo ----------
document.getElementById("manualUsePhotoBtn").addEventListener("click", async () => {
  const empSelect = document.getElementById("employeeSelect");
  if (!empSelect.value) { logMsg("Select an employee first.", "queued"); return; }
  selectedEmployeeId = empSelect.value;
  selectedEmployeeName = empSelect.options[empSelect.selectedIndex].text;
  try {
    await openCamera();
    // give the camera a moment to focus before capturing
    setTimeout(async () => {
      const blob = await captureFrame();
      showConfirm(blob);
    }, 400);
  } catch (err) {
    logMsg("Camera error: " + err.message, "queued");
  }
});

// ---------- Confirm panel ----------
async function showConfirm(blob) {
  capturedPhotoBlob = blob;
  document.getElementById("confirmName").textContent = selectedEmployeeName;
  document.getElementById("confirmPhoto").src = URL.createObjectURL(blob);
  const warnEl = document.getElementById("rosterWarning");
  const onRoster = checkRosterMatch(selectedEmployeeId);
  if (!onRoster) {
    warnEl.textContent = "⚠ Not on today's roster for this branch (not home branch and no roster assignment for today). You can still continue.";
    warnEl.style.display = "block";
  } else {
    warnEl.style.display = "none";
  }
  scanPanel.style.display = "none";
  manualPanel.style.display = "none";
  confirmPanel.style.display = "block";

  document.getElementById("confirmBtn").disabled = true;
  document.getElementById("confirmBtn").textContent = "Checking…";
  document.getElementById("overrideRow").style.display = "none";
  detectedAction = await detectClockAction(selectedEmployeeId);
  // Guard against a stale response if the person cancelled/switched while the lookup was in flight.
  if (selectedEmployeeId !== null) renderActionBadge();
}

document.getElementById("retakeBtn").addEventListener("click", async () => {
  const blob = await captureFrame();
  capturedPhotoBlob = blob;
  document.getElementById("confirmPhoto").src = URL.createObjectURL(blob);
});

document.getElementById("confirmBtn").addEventListener("click", () => {
  const action = detectedAction || "in";
  confirmPanel.style.display = "none";
  submitEntry(action);
});

document.getElementById("cancelBtn").addEventListener("click", () => {
  logMsg("Cancelled — no entry recorded.", "queued");
  setMode(mode); // resets selection and restarts scan/manual for the current mode
});

async function submitEntry(type) {
  const employee_id = selectedEmployeeId;
  const branch_id = document.getElementById("branchSelect").value;
  if (!employee_id || !branch_id) {
    logMsg("Confirm identity and select branch first.", "queued");
    return;
  }
  const entry = {
    id: crypto.randomUUID(),
    employee_id, branch_id, type,
    timestamp: new Date().toISOString(),
    hasPhoto: !!capturedPhotoBlob
  };

  if (navigator.onLine) {
    const ok = await pushEntry(entry, capturedPhotoBlob);
    logMsg(`${type === "in" ? "Timed in" : "Timed out"} — ${selectedEmployeeName} — synced`, ok ? "synced" : "queued");
    if (!ok) queueEntry(entry, capturedPhotoBlob);
  } else {
    queueEntry(entry, capturedPhotoBlob);
    logMsg(`${type === "in" ? "Timed in" : "Timed out"} — ${selectedEmployeeName} — queued offline`, "queued");
  }
  resetSelection();
  setMode(mode); // restart scan loop / reset manual panel for the next person
}

async function pushEntry(entry, photoBlob) {
  try {
    let photo_url = null;
    if (photoBlob) {
      const path = `timesheet/${entry.employee_id}/${entry.id}.jpg`;
      const { error: upErr } = await supabase.storage.from("photos").upload(path, photoBlob);
      if (!upErr) {
        photo_url = supabase.storage.from("photos").getPublicUrl(path).data.publicUrl;
      }
    }
    // NOTE: this assumes an open shift/timesheet_entries row exists to update on "out".
    // Real implementation should look up today's open entry for this employee before inserting.
    if (entry.type === "in") {
      // Pull the roster assignment for this employee+branch today, if any,
      // so the punch is linked back to what Roster scheduled (shift_id,
      // post_id) instead of floating unattached. activeAssignments is the
      // same today-scoped roster_assignments snapshot used for the roster
      // warning above; for entries synced later from the offline queue this
      // may reflect the day the entry was captured, not the sync day, which
      // is what we want.
      const rosterMatch = activeAssignments.find(a => a.employee_id === entry.employee_id && a.branch_id === entry.branch_id);
      const { error } = await supabase.from("timesheet_entries").insert({
        employee_id: entry.employee_id,
        branch_id: entry.branch_id,
        shift_id: rosterMatch ? rosterMatch.shift_id : null,
        post_id: rosterMatch ? rosterMatch.post_id : null,
        reliever: rosterMatch ? rosterMatch.status === "reliever" : false,
        is_double_pump: rosterMatch ? !!rosterMatch.double_pump : false,
        is_emergency_roster: rosterMatch ? !!rosterMatch.emergency_roster : false,
        time_in: entry.timestamp,
        photo_url
      });
      if (error) throw error;
    } else {
      const { data: openRows, error: findErr } = await supabase
        .from("timesheet_entries")
        .select("id")
        .eq("employee_id", entry.employee_id)
        .is("time_out", null)
        .order("time_in", { ascending: false })
        .limit(1);
      if (findErr) throw findErr;
      if (openRows && openRows.length) {
        const { error } = await supabase.from("timesheet_entries")
          .update({ time_out: entry.timestamp }).eq("id", openRows[0].id);
        if (error) throw error;
      } else {
        const rosterMatch = activeAssignments.find(a => a.employee_id === entry.employee_id && a.branch_id === entry.branch_id);
        const { error } = await supabase.from("timesheet_entries").insert({
          employee_id: entry.employee_id,
          branch_id: entry.branch_id,
          shift_id: rosterMatch ? rosterMatch.shift_id : null,
          post_id: rosterMatch ? rosterMatch.post_id : null,
          reliever: rosterMatch ? rosterMatch.status === "reliever" : false,
          is_double_pump: rosterMatch ? !!rosterMatch.double_pump : false,
          is_emergency_roster: rosterMatch ? !!rosterMatch.emergency_roster : false,
          time_out: entry.timestamp,
          photo_url
        });
        if (error) throw error;
      }
    }
    return true;
  } catch (err) {
    console.error(err);
    return false;
  }
}

function queueEntry(entry, photoBlob) {
  const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
  let photoDataUrl = null;
  const finish = () => {
    queue.push({ ...entry, photoDataUrl });
    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
  };
  if (photoBlob) {
    const reader = new FileReader();
    reader.onloadend = () => { photoDataUrl = reader.result; finish(); };
    reader.readAsDataURL(photoBlob);
  } else {
    finish();
  }
}

async function syncQueue() {
  const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
  if (!queue.length) return;
  const remaining = [];
  for (const entry of queue) {
    let blob = null;
    if (entry.photoDataUrl) {
      const res = await fetch(entry.photoDataUrl);
      blob = await res.blob();
    }
    const ok = await pushEntry(entry, blob);
    if (!ok) remaining.push(entry);
  }
  localStorage.setItem(QUEUE_KEY, JSON.stringify(remaining));
  if (remaining.length === 0 && queue.length > 0) {
    logMsg(`${queue.length} queued entr${queue.length === 1 ? "y" : "ies"} synced.`, "synced");
  }
}

function logMsg(msg, cls) {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = `${new Date().toLocaleTimeString()} — ${msg}`;
  log.prepend(div);
}

// ------------------------------------------------------------
// Auto-repopulate today's shift from the admin-set default.
// This NEVER changes the default schedule itself — it only reads
// shift_templates (branch-specific, falling back to the org-wide
// row where branch_id is null) and creates today's row if one
// doesn't already exist. Changing the default requires the admin
// PIN in timesheet-admin.html; this function has no such gate
// because it can't alter the template, only apply it.
// ------------------------------------------------------------
async function ensureTodayShift(branchId) {
  if (!branchId) return;
  const today = new Date().toISOString().slice(0, 10);
  try {
    const { data: templates } = await supabase.from("shift_templates").select("*");
    if (!templates || !templates.length) return; // nothing configured yet

    // A branch's own labeled shifts (Morning/Afternoon/Night, etc.) take
    // priority; only fall back to the org-wide default if this branch
    // has none of its own.
    const branchTemplates = templates.filter(t => t.branch_id === branchId);
    const applicable = branchTemplates.length ? branchTemplates : templates.filter(t => t.branch_id === null);
    if (!applicable.length) return;

    const { data: existingRows } = await supabase.from("shifts")
      .select("shift_label").eq("branch_id", branchId).eq("shift_date", today);
    const existingLabels = new Set((existingRows || []).map(r => r.shift_label));

    // Only fill in labels that don't already have a row today — this
    // never overwrites a shift an admin deliberately overrode for today.
    const toInsert = applicable
      .filter(t => !existingLabels.has(t.shift_label))
      .map(t => ({
        branch_id: branchId,
        shift_date: today,
        shift_label: t.shift_label,
        scheduled_time_in: t.scheduled_time_in,
        scheduled_time_out: t.scheduled_time_out,
        pump_assignment: t.pump_assignment,
        double_pump: t.double_pump,
        emergency_roster: t.emergency_roster
      }));
    if (toInsert.length) {
      await supabase.from("shifts").insert(toInsert);
    }
  } catch (err) {
    console.error("ensureTodayShift failed:", err);
  }
}

// ---------- Init ----------
updateNetStatus();
loadDropdowns().then(() => {
  setMode("scan");
  ensureTodayShift(document.getElementById("branchSelect").value);
});
document.getElementById("branchSelect").addEventListener("change", () => {
  ensureTodayShift(document.getElementById("branchSelect").value);
});
setInterval(syncQueue, 30000); // retry queue every 30s while app is open
</script>
